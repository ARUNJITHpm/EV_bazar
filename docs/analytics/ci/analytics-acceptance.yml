# Reviewable CI template. Install under .github/workflows/ with workflow-scoped GitHub authentication.
name: Public analytics acceptance

on:
  push:
  pull_request:

jobs:
  public-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11
      - run: uv sync --all-groups --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          PUBLIC_ANALYTICS_ORIGIN: ${{ vars.PUBLIC_ANALYTICS_ORIGIN }}
      - run: uv run playwright install --with-deps chromium
      - name: Browser accessibility, charts, static pages and SEO
        run: |
          npm run preview --prefix frontend -- --host 127.0.0.1 --port 4199 &
          trap 'kill $!' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4199/data >/dev/null && break; sleep 1; done
          uv run python scripts/check_analytics_launch.py --url http://127.0.0.1:4199 --skip-performance --report-payload tests/fixtures/part9-stored-report.json --output /tmp/analytics-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-acceptance
          path: /tmp/analytics-acceptance.*
