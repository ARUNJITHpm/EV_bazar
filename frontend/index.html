<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chargeworthy — will your land pay for a charger?</title>
    <meta
      name="description"
      content="Independent EV charging site assessment. We tell you whether a location will make money, and match you to the right operator."
    />
    <meta name="theme-color" content="#0d151e" />
    <!-- Social cards, from the reference build's head. og:image is absent on
         purpose: the designed identity image (og-identity.png) was never
         delivered in design/ - add the tag when the asset lands. -->
    <meta property="og:title" content="Chargeworthy" />
    <meta
      property="og:description"
      content="Independent EV charging site assessment. Right site. Right operator."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- Progressive enhancement only: the token stacks in tokens.css carry
         full system fallbacks, so a blocked font host still renders the
         page correctly (the same approach as the reference report). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
