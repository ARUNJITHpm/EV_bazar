# Every push to main republishes the Hugging Face Space (talk-to/nitara),
# so GitHub stays the single source of truth and the Space is only ever a
# mirror. Force-push is HF's own recommended sync shape - the Space's git
# history is disposable by design.
#
# Needs a repository secret HF_TOKEN (a Hugging Face write token).
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Historical commits still reference the PDFs as LFS pointers; fetch
          # the objects so the push can satisfy the Space's LFS store.
          lfs: true
      - name: Strip PDFs from the mirror
        # The PDFs are reference documents for the GitHub repo, not part of
        # the deployed app - the Space mirror carries main minus *.pdf.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq --ignore-unmatch -- '*.pdf'
          # Deterministic dates: the same main always yields the same mirror
          # SHA, so re-running the workflow is a no-op push, not a rebuild.
          export GIT_AUTHOR_DATE="$(git log -1 --format=%cI)"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          git diff --cached --quiet || git commit -qm "Strip PDFs from the Space mirror"
      - name: Push main to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set; add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          git push --force "https://talk-to:${HF_TOKEN}@huggingface.co/spaces/talk-to/nitara" main
