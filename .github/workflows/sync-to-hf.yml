# Every push to main republishes the Hugging Face Space (talk-to/nitara),
# so GitHub stays the single source of truth and the Space is only ever a
# mirror.
#
# The mirror is ONE ORPHAN COMMIT carrying the current tree, not a copy of
# main's history. That is deliberate. HF Spaces ship a .gitattributes that
# requires whole families of binary files (*.tar.*, *.gz, *.mp4, *.zip ...)
# to be in LFS, and its pre-receive hook scans every object in the push -
# so a binary anywhere in HISTORY breaks the deployment even when the tip
# no longer contains it. Deleting the file at the tip does not help; the
# blob still travels. Publishing only the tree we actually deploy removes
# that entire class of failure, needs no LFS objects at all, and costs
# nothing real: HF builds from the tip, and this Space's git history was
# always declared disposable.
#
# Needs a repository secret HF_TOKEN (a Hugging Face write token).
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Only the tip is published, so there is no history to fetch and no
      # LFS objects to satisfy - the PDFs are deleted below anyway, and a
      # pointer file is all this checkout needs to see of them.
      - uses: actions/checkout@v4

      - name: Build the mirror commit
        # The PDFs and design/ are reference material for the GitHub repo,
        # not part of the deployed app.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE_DATE="$(git log -1 --format=%cI)"
          SOURCE_SHA="$(git rev-parse --short HEAD)"
          git checkout -q --orphan space-mirror
          rm -rf design
          find . -path ./.git -prune -o -name '*.pdf' -print0 | xargs -0 -r rm -f
          git add -A
          # Deterministic dates: the same main always yields the same mirror
          # SHA, so re-running the workflow is a no-op push, not a rebuild.
          export GIT_AUTHOR_DATE="$SOURCE_DATE"
          export GIT_COMMITTER_DATE="$SOURCE_DATE"
          git commit -qm "Deploy $SOURCE_SHA"
          echo "Mirror tree:"
          git ls-files | wc -l
          echo "files. Any binaries HF would demand in LFS:"
          git ls-files -- '*.tar*' '*.gz' '*.mp4' '*.zip' '*.pdf' || true

      - name: Push the mirror to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set; add it in Settings > Secrets and variables > Actions"
            exit 1
          fi
          git push --force "https://talk-to:${HF_TOKEN}@huggingface.co/spaces/talk-to/nitara" space-mirror:main
